version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/db/migration/"
    queries: "internal/db/query/"
    gen:
      go:
        out: "internal/db/sqlc"
        package: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
